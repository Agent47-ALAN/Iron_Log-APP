name: hevy_clone
description: Personal workout tracker — offline-first, Firebase sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_analytics: ^10.8.0
  firebase_crashlytics: ^3.4.8
  firebase_database: ^10.5.7

  # Google Sign-In

  # Charts
  fl_chart: ^0.66.2

  # UI helpers
  uuid: ^4.3.3
  intl: ^0.19.0
  flutter_slidable: ^3.1.0
  gap: ^3.0.1
  iconsax: ^0.0.8
  shared_preferences: ^2.5.5
  google_sign_in: ^6.2.1

  # cloudinary
  image_picker: ^1.1.2
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true